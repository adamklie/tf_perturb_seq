[project]
name = "tf-perturb-seq"
version = "0.1.0"
description = "Analysis and modeling for TF Perturb-seq experiments"
authors = [{ name = "Adam Klie" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.11.4",
    "cnmf>=1.7.0",
    "matplotlib>=3.10.8",
    "mudata>=0.3.2",
    "mygene>=3.2.2",
    "numba>=0.56",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scanpy>=1.11.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
    "synapseclient>=4.10.0",
    "torch>=2.9.1",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "ipykernel>=7.1.0",
    "matplotlib-venn>=1.1.2",
    "openpyxl>=3.1.5",
    "scikit-posthocs>=0.13.0",
    "qmplot>=0.3.3",
    "gseapy>=1.2.1",
    "tangermeme>=0.4.0",
    "xarray>=2025.6.1",
    "pypdf2>=3.0.1",
    "statsmodels>=0.14.6",
    "joblib>=1.5.3",
    "multipy>=0.16",
    "svglib<1.5",
    "muon>=0.1.7",
    "torch-cnmf",
    "adjusttext>=1.3.0",
    "pillow>=12.1.0",
]

[tool.uv.sources]
torch-cnmf = { git = "https://github.com/ymo6/torch_based_cNMF.git" }
