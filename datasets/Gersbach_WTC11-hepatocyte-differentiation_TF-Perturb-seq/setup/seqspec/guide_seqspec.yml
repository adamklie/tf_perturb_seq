description: 'Gersbach Hep (TFP3) CRISPR (gRNA) seqspec. Corrected 2026-06-10 to match the actual fastqs: read structure mirrors the portal 10x 5'' HT v2 CRISPR construct (IGVFFI0021APSA) so the protospacer lands at R2 reverse 63-82 (validated against reads — predictor 63-81, close_enough), with barcode R1 0-15 and UMI R1 16-27 (UMI=12; R1 physical=28bp = 16 BC + 12 UMI). The guide region is kept as region_id=guide so it is recognized as a guide (the portal seqspec types it region_type=cdna, which mislabels it as rna). Onlists left null; barcode whitelist + guide design come from the samplesheet columns. Guide assignment in the pipeline anchors on spacer_tag=TAGCTCTTAAAC (revcomp of the sgrna_scaffold start GTTTAAGAGCTA), so it is robust to exact guide position regardless.'
